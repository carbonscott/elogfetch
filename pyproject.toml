[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elogfetch"
version = "0.1.0"
description = "Fetch LCLS experiment data from the electronic logbook"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.12.5",
    # we use gssapi here directly to use our local ticket
    "gssapi>=1.8.0",
    "sqlmodel>=0.0.37",
    "stamina>=25.1.0",
    "psycopg[binary]<4.0.0,>=3.1.13",
    "alembic>=1.18.4",
]

[dependency-groups]
dev = [
    "prek>=0.3.3",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.1",
    "testcontainers>=4.13.0",
]


[project.scripts]
elogfetch = "elogfetch.cli:main"

[project.urls]
Homepage = "https://github.com/slaclab/fetch-elog"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

